<svg xmlns="http://www.w3.org/2000/svg" width="1960" height="1450" viewBox="0 0 1960 1450" role="img" aria-labelledby="title desc">
  <title id="title">Production-grade AWS real-time financial fraud detection architecture</title>
  <desc id="desc">A dual-region active production design for tokenized payment authorization. Each region performs bounded-latency model scoring, maintains regional online features, and writes idempotent decisions. Kinesis and Flink derive velocity features, S3 and Iceberg support investigation and training, and MRSC DynamoDB supports a shared decision ledger with a third-region witness. Security and operations span all accounts and regions.</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 z" fill="#52657a"/></marker>
    <marker id="both" markerWidth="11" markerHeight="11" refX="5.5" refY="5.5" orient="auto-start-reverse"><path d="M0,0 L11,5.5 L0,11 z" fill="#6c5796"/></marker>
    <style>
      .bg{fill:#f4f7fb}.region{fill:#fff;stroke:#8ba9c2;stroke-width:2.5;rx:22}.platform{fill:#fff9ee;stroke:#c59a4e;stroke-width:2;rx:18}.datagroup{fill:#f7fbf8;stroke:#6c9b7e;stroke-width:2;rx:18}.card{fill:#edf4ff;stroke:#4c7da9;stroke-width:2;rx:12}.store{fill:#e9f5ee;stroke:#4c8a63;stroke-width:2;rx:12}.model{fill:#f2ecfb;stroke:#8064a9;stroke-width:2;rx:12}.ops{fill:#fff3dc;stroke:#bf8a36;stroke-width:2;rx:12}.danger{fill:#fff0ee;stroke:#be6b5d;stroke-width:2;rx:12}.h1{font:700 27px sans-serif;fill:#1b3047}.h2{font:700 19px sans-serif;fill:#263d55}.label{font:600 15px sans-serif;fill:#20354b}.small{font:13px sans-serif;fill:#43596e}.tiny{font:12px sans-serif;fill:#506276}.line{stroke:#52657a;stroke-width:2.4;fill:none;marker-end:url(#arrow)}.lineBoth{stroke:#6c5796;stroke-width:2.5;fill:none;marker-start:url(#both);marker-end:url(#both)}.dash{stroke-dasharray:9 7}.purple{stroke:#8064a9}.green{stroke:#4c8a63}
    </style>
  </defs>
  <rect class="bg" width="1960" height="1450"/>
  <text x="40" y="48" class="h1">AWS real-time financial fraud detection | production reference architecture</text>
  <text x="42" y="76" class="small">Tokenized inputs • regional authorization path • stateful stream intelligence • governed model lifecycle • multi-region recovery</text>

  <rect x="40" y="110" width="1880" height="105" class="ops"/>
  <text x="65" y="142" class="h2">Global entry and entity-aware routing</text>
  <rect x="70" y="158" width="260" height="42" class="card"/><text x="200" y="184" text-anchor="middle" class="label">Payment networks / merchant apps</text>
  <rect x="390" y="158" width="315" height="42" class="card"/><text x="547" y="184" text-anchor="middle" class="label">AWS Global Accelerator + Route 53</text>
  <rect x="770" y="158" width="420" height="42" class="ops"/><text x="980" y="184" text-anchor="middle" class="label">Tokenization boundary • no raw PAN in event lake</text>
  <rect x="1255" y="158" width="600" height="42" class="ops"/><text x="1555" y="184" text-anchor="middle" class="label">Home-region pinning per payment instrument • health checks • failover fencing</text>
  <path d="M330 179 H390" class="line"/><path d="M705 179 H770" class="line"/><path d="M1190 179 H1255" class="line"/>

  <rect x="40" y="250" width="915" height="690" class="region"/>
  <text x="65" y="286" class="h2">PCI production account • Region A • active</text>
  <rect x="70" y="320" width="190" height="65" class="card"/><text x="165" y="347" text-anchor="middle" class="label"><tspan x="165">API Gateway + WAF</tspan><tspan x="165" dy="20" class="small">auth • rate limits</tspan></text>
  <rect x="300" y="320" width="230" height="65" class="card"/><text x="415" y="347" text-anchor="middle" class="label"><tspan x="415">Fraud decision service</tspan><tspan x="415" dy="20" class="small">Lambda • strict deadline • fallback</tspan></text>
  <rect x="585" y="305" width="320" height="80" class="model"/><text x="745" y="337" text-anchor="middle" class="label"><tspan x="745">SageMaker real-time endpoint</tspan><tspan x="745" dy="22" class="small">champion / canary • explainable score</tspan></text>
  <rect x="585" y="410" width="320" height="72" class="store"/><text x="745" y="439" text-anchor="middle" class="label"><tspan x="745">DynamoDB Global features</tspan><tspan x="745" dy="20" class="small">MREC • home-region writer • velocity state</tspan></text>
  <rect x="585" y="510" width="320" height="72" class="store"/><text x="745" y="539" text-anchor="middle" class="label"><tspan x="745">DynamoDB decision ledger</tspan><tspan x="745" dy="20" class="small">MRSC idempotency • conditional writes</tspan></text>
  <path d="M260 352 H300" class="line"/><path d="M530 342 H585" class="line"/><path d="M530 355 H560 V446 H585" class="line"/><path d="M530 365 H570 V546 H585" class="line"/>
  <rect x="300" y="625" width="230" height="74" class="card"/><text x="415" y="654" text-anchor="middle" class="label"><tspan x="415">Kinesis Data Streams</tspan><tspan x="415" dy="21" class="small">regional durable payment log</tspan></text>
  <rect x="70" y="625" width="190" height="74" class="danger"/><text x="165" y="654" text-anchor="middle" class="label"><tspan x="165">Risk action stream</tspan><tspan x="165" dy="21" class="small">step-up • review • block</tspan></text>
  <rect x="585" y="615" width="320" height="88" class="card"/><text x="745" y="647" text-anchor="middle" class="label"><tspan x="745">Managed Apache Flink</tspan><tspan x="745" dy="21" class="small">velocity windows • late events • rules</tspan><tspan x="745" dy="19" class="tiny">checkpointed state • replay from sequence</tspan></text>
  <path d="M415 385 V625" class="line"/><path d="M300 655 H260" class="line"/><path d="M530 661 H585" class="line"/><path d="M745 615 V582" class="line"/>
  <rect x="70" y="755" width="365" height="75" class="store"/><text x="252" y="784" text-anchor="middle" class="label"><tspan x="252">Firehose → S3 raw landing</tspan><tspan x="252" dy="21" class="small">buffered objects • KMS • retention policy</tspan></text>
  <rect x="470" y="755" width="435" height="75" class="danger"/><text x="687" y="784" text-anchor="middle" class="label"><tspan x="687">SQS quarantine + controlled replay</tspan><tspan x="687" dy="21" class="small">schema poison • retry exhaustion • audited redrive</tspan></text>
  <path d="M340 699 V755" class="line"/><path d="M490 699 V725 H687 V755" class="line"/>
  <text x="70" y="875" class="small">Authorization reply: approve / decline / step-up • bounded deadline • deterministic safe fallback</text>
  <text x="70" y="902" class="tiny">At-least-once stream delivery; stable event IDs, conditional ledger writes, and replay-safe consumers provide business idempotency.</text>

  <rect x="1005" y="250" width="915" height="690" class="region"/>
  <text x="1030" y="286" class="h2">PCI production account • Region B • active</text>
  <rect x="1035" y="320" width="190" height="65" class="card"/><text x="1130" y="347" text-anchor="middle" class="label"><tspan x="1130">API Gateway + WAF</tspan><tspan x="1130" dy="20" class="small">auth • rate limits</tspan></text>
  <rect x="1265" y="320" width="230" height="65" class="card"/><text x="1380" y="347" text-anchor="middle" class="label"><tspan x="1380">Fraud decision service</tspan><tspan x="1380" dy="20" class="small">Lambda • strict deadline • fallback</tspan></text>
  <rect x="1550" y="305" width="320" height="80" class="model"/><text x="1710" y="337" text-anchor="middle" class="label"><tspan x="1710">SageMaker real-time endpoint</tspan><tspan x="1710" dy="22" class="small">champion / canary • explainable score</tspan></text>
  <rect x="1550" y="410" width="320" height="72" class="store"/><text x="1710" y="439" text-anchor="middle" class="label"><tspan x="1710">DynamoDB Global features</tspan><tspan x="1710" dy="20" class="small">MREC • home-region writer • velocity state</tspan></text>
  <rect x="1550" y="510" width="320" height="72" class="store"/><text x="1710" y="539" text-anchor="middle" class="label"><tspan x="1710">DynamoDB decision ledger</tspan><tspan x="1710" dy="20" class="small">MRSC idempotency • conditional writes</tspan></text>
  <path d="M1225 352 H1265" class="line"/><path d="M1495 342 H1550" class="line"/><path d="M1495 355 H1525 V446 H1550" class="line"/><path d="M1495 365 H1535 V546 H1550" class="line"/>
  <rect x="1265" y="625" width="230" height="74" class="card"/><text x="1380" y="654" text-anchor="middle" class="label"><tspan x="1380">Kinesis Data Streams</tspan><tspan x="1380" dy="21" class="small">regional durable payment log</tspan></text>
  <rect x="1035" y="625" width="190" height="74" class="danger"/><text x="1130" y="654" text-anchor="middle" class="label"><tspan x="1130">Risk action stream</tspan><tspan x="1130" dy="21" class="small">step-up • review • block</tspan></text>
  <rect x="1550" y="615" width="320" height="88" class="card"/><text x="1710" y="647" text-anchor="middle" class="label"><tspan x="1710">Managed Apache Flink</tspan><tspan x="1710" dy="21" class="small">velocity windows • late events • rules</tspan><tspan x="1710" dy="19" class="tiny">checkpointed state • replay from sequence</tspan></text>
  <path d="M1380 385 V625" class="line"/><path d="M1265 661 H1225" class="line"/><path d="M1495 661 H1550" class="line"/><path d="M1710 615 V582" class="line"/>
  <rect x="1035" y="755" width="365" height="75" class="store"/><text x="1217" y="784" text-anchor="middle" class="label"><tspan x="1217">Firehose → S3 raw landing</tspan><tspan x="1217" dy="21" class="small">buffered objects • KMS • retention policy</tspan></text>
  <rect x="1435" y="755" width="435" height="75" class="danger"/><text x="1652" y="784" text-anchor="middle" class="label"><tspan x="1652">SQS quarantine + controlled replay</tspan><tspan x="1652" dy="21" class="small">schema poison • retry exhaustion • audited redrive</tspan></text>
  <path d="M1310 699 V755" class="line"/><path d="M1460 699 V725 H1652 V755" class="line"/>
  <text x="1035" y="875" class="small">Independent regional inference + stream processing • no synchronous cross-region feature call</text>
  <text x="1035" y="902" class="tiny">Mirror by partition key with producer IDs; retain source sequence metadata for deterministic rebuild and reconciliation.</text>

  <path d="M1855 200 V230 H20 V352 H70" class="line"/>
  <path d="M1855 200 V300 H1130 V320" class="line"/>
  <path d="M905 446 H1005" class="lineBoth"/>
  <text x="955" y="429" text-anchor="middle" class="tiny">DynamoDB MREC • single-writer home-region routing</text>
  <path d="M905 546 H1005" class="lineBoth"/>
  <text x="955" y="527" text-anchor="middle" class="tiny">MRSC • two replicas + witness Region C</text>
  <path d="M905 650 H1005" class="lineBoth dash"/>
  <text x="955" y="637" text-anchor="middle" class="tiny">source-only relay • origin_region loop guard • controlled failover</text>

  <rect x="40" y="990" width="1880" height="255" class="datagroup"/>
  <text x="65" y="1028" class="h2">Data + model platform account • independent from PCI serving path</text>
  <rect x="75" y="1060" width="300" height="125" class="store"/><text x="225" y="1094" text-anchor="middle" class="label"><tspan x="225">S3 lakehouse</tspan><tspan x="225" dy="23" class="small">raw → bronze → silver → gold</tspan><tspan x="225" dy="21" class="small">Glue Spark + Apache Iceberg</tspan><tspan x="225" dy="21" class="tiny">CDC • dedupe • reconciliation</tspan></text>
  <rect x="420" y="1060" width="245" height="125" class="card"/><text x="542" y="1094" text-anchor="middle" class="label"><tspan x="542">Catalog + governance</tspan><tspan x="542" dy="23" class="small">Glue Data Catalog</tspan><tspan x="542" dy="21" class="small">Lake Formation grants</tspan><tspan x="542" dy="21" class="tiny">row / column access</tspan></text>
  <rect x="710" y="1060" width="260" height="125" class="model"/><text x="840" y="1094" text-anchor="middle" class="label"><tspan x="840">SageMaker Pipelines</tspan><tspan x="840" dy="23" class="small">training + temporal backtests</tspan><tspan x="840" dy="21" class="small">leakage / bias / drift checks</tspan><tspan x="840" dy="21" class="tiny">point-in-time feature joins</tspan></text>
  <rect x="1015" y="1060" width="245" height="125" class="model"/><text x="1137" y="1094" text-anchor="middle" class="label"><tspan x="1137">Model Registry</tspan><tspan x="1137" dy="23" class="small">approval + lineage</tspan><tspan x="1137" dy="21" class="small">champion / challenger</tspan><tspan x="1137" dy="21" class="tiny">rollback gate</tspan></text>
  <rect x="1305" y="1060" width="245" height="125" class="card"/><text x="1427" y="1094" text-anchor="middle" class="label"><tspan x="1427">Investigation SQL</tspan><tspan x="1427" dy="23" class="small">Athena + governed views</tspan><tspan x="1427" dy="21" class="small">optional Redshift Serverless</tspan><tspan x="1427" dy="21" class="tiny">analyst case workflow</tspan></text>
  <rect x="1595" y="1060" width="280" height="125" class="ops"/><text x="1735" y="1094" text-anchor="middle" class="label"><tspan x="1735">Step Functions orchestration</tspan><tspan x="1735" dy="23" class="small">replay • reconciliation • retraining</tspan><tspan x="1735" dy="21" class="small">human approval • canary promotion</tspan><tspan x="1735" dy="21" class="tiny">auditable model release</tspan></text>
  <path d="M375 1122 H420" class="line"/><path d="M665 1122 H710" class="line"/><path d="M970 1122 H1015" class="line"/><path d="M1260 1122 H1305" class="line"/><path d="M1550 1122 H1595" class="line"/>
  <path d="M252 830 V960 H225 V1060" class="line"/><path d="M1217 830 V960 H225 V1060" class="line"/>
  <path d="M840 1060 V965 H745 V385" class="line dash purple"/><path d="M840 1060 V965 H1710 V385" class="line dash purple"/>

  <rect x="40" y="1280" width="1880" height="125" class="platform"/>
  <text x="65" y="1312" class="h2">Cross-account security, observability, and deployment controls</text>
  <text x="70" y="1342" class="label">Organizations: PCI serving • data platform • security / log archive</text>
  <text x="70" y="1367" class="small">IAM least privilege • KMS multi-Region keys • PrivateLink • CloudTrail • GuardDuty • Security Hub • immutable audit trail</text>
  <text x="1010" y="1342" class="label">CloudWatch + X-Ray + OpenTelemetry → incident bus → SNS / on-call</text>
  <text x="1010" y="1367" class="small">SLO: decision latency • false-positive rate • recall • stream lag • feature staleness • model fallback • replica lag</text>
  <text x="70" y="1391" class="tiny">CI/CD: OIDC federation + Terraform • contract / replay / load / chaos tests • blue-green Flink + model rollout • rollback on guardrail breach • MRSC quorum latency is budgeted in decision SLO</text>
</svg>
